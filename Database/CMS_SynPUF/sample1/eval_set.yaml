# =============================================================
# DE-SynPUF NL-to-SQL Evaluation Set  v0.1
#
# Data:    DE-SynPUF Sample 1 (2008-2010)
# Dialect: DuckDB
# Tables:  bene_2008 / bene_2009 / bene_2010 / inpatient /
#          outpatient / carrier / pde
# Dates:   CHAR(8) 'YYYYMMDD' strings.
#          Parse with strptime(col, '%Y%m%d')::DATE.
# Year:    If the question names a year, gold uses that year.
#          If it does not, gold uses the full extract (2008-2010):
#          unique people across bene_*, attributes from the latest
#          year they appear, claims unfiltered.
#
# How to use:
#   1. Verify column names against the actual CSV headers
#   2. Run each gold_sql, fill the result into gold_answer
#      (currently USER_INPUT)
#   3. Run wrong_sql, fill the result in as the key of
#      common_wrong_answers
#   4. If wrong_sql returns the same value as gold_answer, the
#      case does not exercise its trap -> revise or drop it
#
# Fields:
#   tier          difficulty layer
#   traps         what this case tests (report aggregates by this)
#   gold_sql      reference SQL
#   gold_answer   reference value  <- you fill this in
#   answer_type   scalar / table
#   tolerance     numeric tolerance
#   wrong_sql     plausible wrong query (validates the case)
#   notes         definition notes / items to confirm with mentor
# =============================================================

meta:
  version: "0.1"
  dataset: "DE-SynPUF Sample 1"
  dialect: duckdb
  date_format: "CHAR(8) YYYYMMDD"
  total_cases: 70
