- id: L2-008
  tier: join
  question: "What is the per-person prescription drug cost, broken out by sex?"
  gold_sql: |
    WITH person AS (
      SELECT DESYNPUF_ID, BENE_SEX_IDENT_CD
      FROM (
        SELECT DESYNPUF_ID, BENE_SEX_IDENT_CD, 2010 AS yr FROM bene_2010
        UNION ALL SELECT DESYNPUF_ID, BENE_SEX_IDENT_CD, 2009 FROM bene_2009
        UNION ALL SELECT DESYNPUF_ID, BENE_SEX_IDENT_CD, 2008 FROM bene_2008
      )
      QUALIFY ROW_NUMBER() OVER (PARTITION BY DESYNPUF_ID ORDER BY yr DESC) = 1
    )
    SELECT p.BENE_SEX_IDENT_CD,
           SUM(d.TOT_RX_CST_AMT) / COUNT(DISTINCT p.DESYNPUF_ID) AS per_capita
    FROM person p
    LEFT JOIN pde d ON p.DESYNPUF_ID = d.DESYNPUF_ID
    GROUP BY 1;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [denominator_all_vs_users, left_join_required]
  wrong_sql: |
    -- Wrong: INNER JOIN narrows the denominator to drug users only
    SELECT b.BENE_SEX_IDENT_CD,
           SUM(p.TOT_RX_CST_AMT) / COUNT(DISTINCT b.DESYNPUF_ID)
    FROM bene_2009 b JOIN pde p ON b.DESYNPUF_ID = p.DESYNPUF_ID
    GROUP BY 1;
  common_wrong_answers:
    USER_INPUT: "INNER JOIN dropped beneficiaries with no drug events from the denominator"
  notes: "CONFIRM WITH MENTOR: does 'per person' default to all beneficiaries or only those with drug events?"

