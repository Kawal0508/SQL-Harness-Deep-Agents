# =============================================================
# L4 — Metric computation (14 cases)
# Multi-step reasoning requiring CTEs and window functions.
# Several traps stack in a single case.
# =============================================================

- id: L4-001
  tier: metric
  question: "What was the 30-day all-cause readmission rate in 2009?"
  gold_sql: |
    WITH idx AS (
      SELECT DESYNPUF_ID, CLM_ID,
             strptime(NCH_BENE_DSCHRG_DT, '%Y%m%d')::DATE AS dis
      FROM inpatient
      WHERE SUBSTRING(CLM_ADMSN_DT, 1, 4) = '2009'
        AND NCH_BENE_DSCHRG_DT IS NOT NULL
    ),
    readmit AS (
      SELECT DISTINCT i.CLM_ID
      FROM idx i
      JOIN inpatient r ON r.DESYNPUF_ID = i.DESYNPUF_ID
      WHERE r.CLM_ID <> i.CLM_ID
        AND strptime(r.CLM_ADMSN_DT, '%Y%m%d')::DATE >  i.dis
        AND strptime(r.CLM_ADMSN_DT, '%Y%m%d')::DATE <= i.dis + INTERVAL 30 DAY
    )
    SELECT COUNT(DISTINCT r.CLM_ID)::float / COUNT(DISTINCT i.CLM_ID)
    FROM idx i LEFT JOIN readmit r ON i.CLM_ID = r.CLM_ID;
  gold_answer: 0.07561226934194565
  answer_type: scalar
  tolerance: 0.0001
  traps: [date_as_string, window_boundary, self_join, index_stay_definition]
  notes: |
    CONFIRM WITH MENTOR — four choices, each changes the result:
      - clock starts at discharge (used here) or admission
      - window includes day 30 (used here) or not
      - planned readmissions excluded (not excluded here)
      - index stays ending in death excluded (not excluded here)

- id: L4-002
  tier: metric
  question: "What is the 30-day readmission rate for heart failure patients?"
  gold_sql: |
    WITH idx AS (
      SELECT DESYNPUF_ID, CLM_ID,
             strptime(NCH_BENE_DSCHRG_DT, '%Y%m%d')::DATE AS dis
      FROM inpatient
      WHERE NCH_BENE_DSCHRG_DT IS NOT NULL
        AND ICD9_DGNS_CD_1 LIKE '428%'
    ),
    readmit AS (
      SELECT DISTINCT i.CLM_ID
      FROM idx i
      JOIN inpatient r ON r.DESYNPUF_ID = i.DESYNPUF_ID
      WHERE r.CLM_ID <> i.CLM_ID
        AND strptime(r.CLM_ADMSN_DT, '%Y%m%d')::DATE >  i.dis
        AND strptime(r.CLM_ADMSN_DT, '%Y%m%d')::DATE <= i.dis + INTERVAL 30 DAY
    )
    SELECT COUNT(DISTINCT r.CLM_ID)::float / COUNT(DISTINCT i.CLM_ID)
    FROM idx i LEFT JOIN readmit r ON i.CLM_ID = r.CLM_ID;
  gold_answer: 0.10881323367357254
  answer_type: scalar
  tolerance: 0.0001
  traps: [date_as_string, window_boundary, icd9_code_knowledge]
  requires_knowledge: [icd9_chf_codes]
  notes: "Index stays defined by principal diagnosis (CMS convention), unlike L3-F01 which uses any position. That contrast is itself worth measuring"

- id: L4-003
  tier: metric
  question: "For the 10 DRGs with the highest total spend, what percentage of total inpatient spend does each represent?"
  gold_sql: |
    WITH totals AS (
      SELECT CLM_DRG_CD, SUM(CLM_PMT_AMT) AS amt FROM inpatient GROUP BY 1
    )
    SELECT CLM_DRG_CD, amt,
           amt / SUM(amt) OVER () * 100 AS pct
    FROM totals ORDER BY amt DESC LIMIT 10;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [window_function, percent_of_total]
  notes: "Denominator must be spend across all DRGs, not the top 10 subtotal"

- id: L4-004
  tier: metric
  question: "How many times higher is per-person spend for diabetic patients than for non-diabetic patients?"
  gold_sql: |
    WITH person AS (
      SELECT DESYNPUF_ID,
             MAX(CASE WHEN SP_DIABETES = 1 THEN 1 ELSE 0 END) AS dm
      FROM (
        SELECT DESYNPUF_ID, SP_DIABETES FROM bene_2008
        UNION ALL SELECT DESYNPUF_ID, SP_DIABETES FROM bene_2009
        UNION ALL SELECT DESYNPUF_ID, SP_DIABETES FROM bene_2010
      )
      GROUP BY 1
    ),
    spend AS (
      SELECT p.DESYNPUF_ID, p.dm,
             COALESCE(SUM(i.CLM_PMT_AMT), 0) AS amt
      FROM person p
      LEFT JOIN inpatient i ON p.DESYNPUF_ID = i.DESYNPUF_ID
      GROUP BY 1, 2
    )
    SELECT
      AVG(CASE WHEN dm = 1 THEN amt END)
      / AVG(CASE WHEN dm <> 1 THEN amt END) AS ratio
    FROM spend;
  gold_answer: 8.477606999137949
  answer_type: scalar
  tolerance: 0.01
  traps: [denominator_all_vs_users, chronic_flag_encoding, left_join_required]
  notes: "People with no hospitalization must stay in the denominator at zero, or the ratio distorts"

- id: L4-005
  tier: metric
  question: "Rank states by per-person inpatient spend, top 10."
  gold_sql: |
    WITH person AS (
      SELECT DESYNPUF_ID, SP_STATE_CODE
      FROM (
        SELECT DESYNPUF_ID, SP_STATE_CODE, 2010 AS yr FROM bene_2010
        UNION ALL SELECT DESYNPUF_ID, SP_STATE_CODE, 2009 FROM bene_2009
        UNION ALL SELECT DESYNPUF_ID, SP_STATE_CODE, 2008 FROM bene_2008
      )
      QUALIFY ROW_NUMBER() OVER (PARTITION BY DESYNPUF_ID ORDER BY yr DESC) = 1
    )
    SELECT p.SP_STATE_CODE,
           COALESCE(SUM(i.CLM_PMT_AMT), 0) / COUNT(DISTINCT p.DESYNPUF_ID) AS per_capita
    FROM person p
    LEFT JOIN inpatient i ON p.DESYNPUF_ID = i.DESYNPUF_ID
    GROUP BY 1 ORDER BY per_capita DESC LIMIT 10;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [denominator_all_vs_users, left_join_required]

- id: L4-006
  tier: metric
  question: "What was the year-over-year growth in inpatient spend from 2008 to 2010?"
  gold_sql: |
    WITH yearly AS (
      SELECT SUBSTRING(CLM_FROM_DT, 1, 4) AS yr, SUM(CLM_PMT_AMT) AS amt
      FROM inpatient
      WHERE SUBSTRING(CLM_FROM_DT, 1, 4) IN ('2008','2009','2010')
      GROUP BY 1
    )
    SELECT yr, amt,
           (amt - LAG(amt) OVER (ORDER BY yr)) / LAG(amt) OVER (ORDER BY yr) AS growth
    FROM yearly ORDER BY yr;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [window_function, date_as_string]

- id: L4-007
  tier: metric
  question: "What are the median and 90th percentile inpatient payment amounts?"
  gold_sql: |
    SELECT
      PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY CLM_PMT_AMT) AS p50,
      PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY CLM_PMT_AMT) AS p90
    FROM inpatient;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [percentile_syntax]

- id: L4-008
  tier: metric
  question: "What share of total spend is accounted for by the highest-spending 5% of beneficiaries?"
  gold_sql: |
    WITH person AS (
      SELECT DISTINCT DESYNPUF_ID FROM (
        SELECT DESYNPUF_ID FROM bene_2008
        UNION ALL SELECT DESYNPUF_ID FROM bene_2009
        UNION ALL SELECT DESYNPUF_ID FROM bene_2010
      )
    ),
    spend AS (
      SELECT p.DESYNPUF_ID, COALESCE(SUM(i.CLM_PMT_AMT), 0) AS amt
      FROM person p
      LEFT JOIN inpatient i ON p.DESYNPUF_ID = i.DESYNPUF_ID
      GROUP BY 1
    ),
    ranked AS (
      SELECT amt, NTILE(20) OVER (ORDER BY amt DESC) AS bucket FROM spend
    )
    SELECT SUM(CASE WHEN bucket = 1 THEN amt ELSE 0 END)::float
           / SUM(amt) * 100 AS pct
    FROM ranked;
  gold_answer: 46.73485403079541
  answer_type: scalar
  tolerance: 0.01
  traps: [window_function, denominator_all_vs_users]
  notes: "Zero-spend beneficiaries must be in the base population, or 'top 5%' is measured against the wrong denominator"

- id: L4-009
  tier: metric
  question: "What percentage of patients died within 30 days of their first 2009 hospitalization?"
  gold_sql: |
    WITH first_stay AS (
      SELECT DESYNPUF_ID,
             strptime(NCH_BENE_DSCHRG_DT, '%Y%m%d')::DATE AS dis
      FROM inpatient
      WHERE SUBSTRING(CLM_ADMSN_DT, 1, 4) = '2009'
        AND NCH_BENE_DSCHRG_DT IS NOT NULL
      QUALIFY ROW_NUMBER() OVER (PARTITION BY DESYNPUF_ID ORDER BY CLM_ADMSN_DT) = 1
    )
    SELECT SUM(CASE
             WHEN b.BENE_DEATH_DT IS NOT NULL
              AND strptime(b.BENE_DEATH_DT, '%Y%m%d')::DATE <= f.dis + INTERVAL 30 DAY
             THEN 1 ELSE 0 END)::float / COUNT(*) AS rate
    FROM first_stay f
    JOIN bene_2009 b ON f.DESYNPUF_ID = b.DESYNPUF_ID;
  gold_answer: 0.001274291193112731
  answer_type: scalar
  tolerance: 0.0001
  traps: [date_as_string, first_event_selection, null_semantics, window_boundary]

- id: L4-010
  tier: metric
  question: "For the 10 highest-volume DRGs, what are the average length of stay and average payment?"
  gold_sql: |
    SELECT CLM_DRG_CD,
           COUNT(*) AS n,
           AVG(CLM_UTLZTN_DAY_CNT) AS avg_los,
           AVG(CLM_PMT_AMT) AS avg_pmt
    FROM inpatient
    WHERE CLM_DRG_CD IS NOT NULL
    GROUP BY 1 ORDER BY n DESC LIMIT 10;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [null_semantics]

- id: L4-011
  tier: metric
  question: "How do patients who were readmitted differ from those who weren't, in terms of number of chronic conditions?"
  gold_sql: |
    WITH idx AS (
      SELECT DESYNPUF_ID, CLM_ID,
             strptime(NCH_BENE_DSCHRG_DT, '%Y%m%d')::DATE AS dis
      FROM inpatient
      WHERE NCH_BENE_DSCHRG_DT IS NOT NULL
    ),
    flagged AS (
      SELECT i.DESYNPUF_ID,
             MAX(CASE WHEN EXISTS (
               SELECT 1 FROM inpatient r
               WHERE r.DESYNPUF_ID = i.DESYNPUF_ID AND r.CLM_ID <> i.CLM_ID
                 AND strptime(r.CLM_ADMSN_DT, '%Y%m%d')::DATE >  i.dis
                 AND strptime(r.CLM_ADMSN_DT, '%Y%m%d')::DATE <= i.dis + INTERVAL 30 DAY
             ) THEN 1 ELSE 0 END) AS has_readmit
      FROM idx i GROUP BY 1
    )
    SELECT f.has_readmit,
           COUNT(*) AS n,
           AVG(CASE WHEN b.SP_ALZHDMTA=1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_CHF     =1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_CHRNKIDN=1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_CNCR    =1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_COPD    =1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_DEPRESSN=1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_DIABETES=1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_ISCHMCHT=1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_OSTEOPRS=1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_RA_OA   =1 THEN 1 ELSE 0 END
             + CASE WHEN b.SP_STRKETIA=1 THEN 1 ELSE 0 END)::float AS avg_chronic
    FROM flagged f
    JOIN (
      SELECT DESYNPUF_ID, SP_ALZHDMTA, SP_CHF, SP_CHRNKIDN, SP_CNCR, SP_COPD,
             SP_DEPRESSN, SP_DIABETES, SP_ISCHMCHT, SP_OSTEOPRS, SP_RA_OA, SP_STRKETIA
      FROM (
        SELECT *, 2010 AS yr FROM bene_2010
        UNION ALL SELECT *, 2009 FROM bene_2009
        UNION ALL SELECT *, 2008 FROM bene_2008
      )
      QUALIFY ROW_NUMBER() OVER (PARTITION BY DESYNPUF_ID ORDER BY yr DESC) = 1
    ) b ON f.DESYNPUF_ID = b.DESYNPUF_ID
    GROUP BY 1;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [self_join, chronic_flag_encoding, multi_column_aggregation]

- id: L4-012
  tier: metric
  question: "Show the hospitalization rate for heart failure patients by state, reporting only results that are releasable."
  gold_sql: |
    WITH chf AS (
      SELECT DESYNPUF_ID,
             arg_max(SP_STATE_CODE, yr) AS SP_STATE_CODE
      FROM (
        SELECT DESYNPUF_ID, SP_STATE_CODE, SP_CHF, 2010 AS yr FROM bene_2010
        UNION ALL SELECT DESYNPUF_ID, SP_STATE_CODE, SP_CHF, 2009 FROM bene_2009
        UNION ALL SELECT DESYNPUF_ID, SP_STATE_CODE, SP_CHF, 2008 FROM bene_2008
      )
      GROUP BY 1
      HAVING MAX(CASE WHEN SP_CHF = 1 THEN 1 ELSE 0 END) = 1
    )
    SELECT c.SP_STATE_CODE,
           COUNT(DISTINCT c.DESYNPUF_ID) AS denom,
           COUNT(DISTINCT i.DESYNPUF_ID) AS numer,
           COUNT(DISTINCT i.DESYNPUF_ID)::float
             / COUNT(DISTINCT c.DESYNPUF_ID) AS rate
    FROM chf c
    LEFT JOIN inpatient i
      ON c.DESYNPUF_ID = i.DESYNPUF_ID
    GROUP BY 1
    HAVING COUNT(DISTINCT c.DESYNPUF_ID) >= 11
    ORDER BY rate DESC;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [cell_suppression, chronic_flag_encoding]
  requires_knowledge: [cms_cell_suppression_rule]
  notes: |
    CMS disclosure policy: cells with fewer than 11 patients must be
    suppressed. The agent cannot know this on its own — it has to come
    from the semantic layer. Strong demo material: it shows the team
    understands Telligen's compliance requirements, not just the SQL.

- id: L4-013
  tier: metric
  question: "What was the monthly trend in inpatient spend during 2009? Identify the highest and lowest months."
  gold_sql: |
    SELECT SUBSTRING(CLM_ADMSN_DT, 5, 2) AS mon,
           SUM(CLM_PMT_AMT) AS amt,
           COUNT(*) AS n_stays
    FROM inpatient
    WHERE SUBSTRING(CLM_ADMSN_DT, 1, 4) = '2009'
    GROUP BY 1 ORDER BY 1;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [date_as_string, narrative_correctness]
  notes: "Also grades the final narrative — correct SQL with a reversed explanation still counts as wrong"

