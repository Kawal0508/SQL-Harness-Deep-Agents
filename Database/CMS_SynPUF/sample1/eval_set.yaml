- id: L2-001
  tier: join
  question: "Among beneficiaries with diabetes, how many had an inpatient stay in 2009?"
  gold_sql: |
    SELECT COUNT(DISTINCT b.DESYNPUF_ID)
    FROM bene_2009 b
    JOIN inpatient i ON b.DESYNPUF_ID = i.DESYNPUF_ID
    WHERE b.SP_DIABETES = 1
      AND SUBSTRING(i.CLM_FROM_DT, 1, 4) = '2009';
  gold_answer: 14417
  answer_type: scalar
  tolerance: 0
  traps: [chronic_flag_encoding, distinct_person_vs_claim]
  wrong_sql: |
    -- Wrong: counts claims rather than people
    SELECT COUNT(*)
    FROM bene_2009 b JOIN inpatient i ON b.DESYNPUF_ID = i.DESYNPUF_ID
    WHERE b.SP_DIABETES = 1 AND SUBSTRING(i.CLM_FROM_DT,1,4) = '2009';
  common_wrong_answers:
    USER_INPUT: "counted claims instead of people"
  notes: "If SP_DIABETES is 1=yes / 2=no, then '>0' or '=1 OR =2' selects everyone"

- id: L2-002
  tier: join
  question: "Show total inpatient payments by state, highest first."
  gold_sql: |
    WITH person AS (
      SELECT DESYNPUF_ID, SP_STATE_CODE
      FROM (
        SELECT DESYNPUF_ID, SP_STATE_CODE, 2010 AS yr FROM bene_2010
        UNION ALL SELECT DESYNPUF_ID, SP_STATE_CODE, 2009 FROM bene_2009
        UNION ALL SELECT DESYNPUF_ID, SP_STATE_CODE, 2008 FROM bene_2008
      )
      QUALIFY ROW_NUMBER() OVER (PARTITION BY DESYNPUF_ID ORDER BY yr DESC) = 1
    )
    SELECT p.SP_STATE_CODE, SUM(i.CLM_PMT_AMT) AS total
    FROM inpatient i
    JOIN person p ON i.DESYNPUF_ID = p.DESYNPUF_ID
    GROUP BY 1 ORDER BY total DESC;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [year_alignment]

