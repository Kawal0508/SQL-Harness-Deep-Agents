- id: L2-012
  tier: join
  question: "What is the diabetes prevalence rate by state?"
  gold_sql: |
    WITH person AS (
      SELECT DESYNPUF_ID,
             MAX(CASE WHEN SP_DIABETES = 1 THEN 1 ELSE 0 END) AS ever_dm,
             arg_max(SP_STATE_CODE, yr) AS SP_STATE_CODE
      FROM (
        SELECT DESYNPUF_ID, SP_STATE_CODE, SP_DIABETES, 2010 AS yr FROM bene_2010
        UNION ALL SELECT DESYNPUF_ID, SP_STATE_CODE, SP_DIABETES, 2009 FROM bene_2009
        UNION ALL SELECT DESYNPUF_ID, SP_STATE_CODE, SP_DIABETES, 2008 FROM bene_2008
      )
      GROUP BY 1
    )
    SELECT SP_STATE_CODE,
           SUM(ever_dm)::float / COUNT(*) AS rate
    FROM person
    GROUP BY 1 ORDER BY rate DESC;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [chronic_flag_encoding, integer_division]
  wrong_sql: |
    -- Wrong: integer division returns all zeros in Postgres
    SELECT SP_STATE_CODE,
           SUM(CASE WHEN SP_DIABETES = 1 THEN 1 ELSE 0 END) / COUNT(*)
