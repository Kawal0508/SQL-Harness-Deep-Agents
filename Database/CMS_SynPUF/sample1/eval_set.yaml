- id: L2-016
  tier: join
  question: "What is the hospitalization rate for each age band (under 65, 65-74, 75-84, 85+)?"
  gold_sql: |
    WITH ages AS (
      SELECT DESYNPUF_ID,
             yr - CAST(SUBSTRING(BENE_BIRTH_DT, 1, 4) AS INT) AS age
      FROM (
        SELECT DESYNPUF_ID, BENE_BIRTH_DT, 2010 AS yr FROM bene_2010
        UNION ALL SELECT DESYNPUF_ID, BENE_BIRTH_DT, 2009 FROM bene_2009
        UNION ALL SELECT DESYNPUF_ID, BENE_BIRTH_DT, 2008 FROM bene_2008
      )
      QUALIFY ROW_NUMBER() OVER (PARTITION BY DESYNPUF_ID ORDER BY yr DESC) = 1
    ),
    grp AS (
      SELECT DESYNPUF_ID,
             CASE WHEN age < 65 THEN '<65'
                  WHEN age < 75 THEN '65-74'
                  WHEN age < 85 THEN '75-84'
                  ELSE '85+' END AS band
      FROM ages
    )
    SELECT g.band,
           COUNT(DISTINCT i.DESYNPUF_ID)::float / COUNT(DISTINCT g.DESYNPUF_ID) AS rate
    FROM grp g
    LEFT JOIN inpatient i
      ON g.DESYNPUF_ID = i.DESYNPUF_ID
    GROUP BY 1 ORDER BY 1;
  gold_answer: USER_INPUT
  answer_type: table
  traps: [date_as_string, left_join_required, integer_division]

- id: L2-017
  tier: join
  question: "How many beneficiaries had no claims of any kind in 2009 — no inpatient, outpatient, carrier, or drug events?"
  gold_sql: |
    SELECT COUNT(*)
    FROM bene_2009 b
    WHERE b.DESYNPUF_ID NOT IN (SELECT DESYNPUF_ID FROM inpatient  WHERE SUBSTRING(CLM_FROM_DT,1,4)='2009')
      AND b.DESYNPUF_ID NOT IN (SELECT DESYNPUF_ID FROM outpatient WHERE SUBSTRING(CLM_FROM_DT,1,4)='2009')
      AND b.DESYNPUF_ID NOT IN (SELECT DESYNPUF_ID FROM carrier    WHERE SUBSTRING(CLM_FROM_DT,1,4)='2009')
      AND b.DESYNPUF_ID NOT IN (SELECT DESYNPUF_ID FROM pde        WHERE SUBSTRING(SRVC_DT,1,4)='2009');
  gold_answer: 12776
  answer_type: scalar
  tolerance: 0
  traps: [not_in_null_trap, multi_source]
  notes: "NOT IN against a subquery containing NULL returns an empty set — a classic trap. Use NOT EXISTS if the column is nullable"

- id: L2-018
  tier: join
  question: "Among 2009 inpatients, how many had an outpatient visit in the 30 days before admission?"
  gold_sql: |
    SELECT COUNT(DISTINCT i.DESYNPUF_ID)
    FROM inpatient i
    WHERE SUBSTRING(i.CLM_FROM_DT, 1, 4) = '2009'
      AND EXISTS (
        SELECT 1 FROM outpatient o
        WHERE o.DESYNPUF_ID = i.DESYNPUF_ID
          AND strptime(o.CLM_FROM_DT, '%Y%m%d')::DATE
              BETWEEN strptime(i.CLM_FROM_DT, '%Y%m%d')::DATE - INTERVAL 30 DAY
                  AND strptime(i.CLM_FROM_DT, '%Y%m%d')::DATE
      );
  gold_answer: 7038
  answer_type: scalar
  tolerance: 0
  traps: [date_as_string, window_boundary]


# =============================================================
# L3 — Aggregation semantics (24 cases)  *** CORE LAYER ***
# These look like L2 cases but carry an implicit correct
# definition. Wrong answers don't error, aren't empty, and look
# entirely reasonable.
# =============================================================

# --- Group A: denominator definition (5 cases) ---

- id: L3-A01
  tier: aggregation_semantics
  question: "What was the per-person inpatient payment in 2009?"
  gold_sql: |
    SELECT SUM(i.CLM_PMT_AMT) / COUNT(DISTINCT b.DESYNPUF_ID)
    FROM bene_2009 b
    LEFT JOIN inpatient i
      ON b.DESYNPUF_ID = i.DESYNPUF_ID
     AND SUBSTRING(i.CLM_FROM_DT, 1, 4) = '2009';
  gold_answer: 2137.3716146606366
  answer_type: scalar
  tolerance: 0.01
  traps: [denominator_all_vs_users]
  wrong_sql: |
    -- Wrong: denominator becomes "people who were hospitalized"
    SELECT SUM(CLM_PMT_AMT) / COUNT(DISTINCT DESYNPUF_ID)
    FROM inpatient WHERE SUBSTRING(CLM_FROM_DT,1,4)='2009';
  common_wrong_answers:
    USER_INPUT: "used hospitalized count as denominator instead of all beneficiaries"
  notes: "CONFIRM WITH MENTOR: what does 'per person' default to here?"

- id: L3-A02
  tier: aggregation_semantics
  question: "Using all enrolled beneficiaries as the denominator, what was the per-person inpatient payment in 2009?"
  gold_sql: |
    SELECT SUM(i.CLM_PMT_AMT) / COUNT(DISTINCT b.DESYNPUF_ID)
    FROM bene_2009 b
    LEFT JOIN inpatient i
      ON b.DESYNPUF_ID = i.DESYNPUF_ID
     AND SUBSTRING(i.CLM_FROM_DT, 1, 4) = '2009';
  gold_answer: 2137.3716146606366
  answer_type: scalar
  tolerance: 0.01
  traps: [denominator_all_vs_users]
  notes: "PAIRED with L3-A01. Compare accuracy when the definition is stated vs left implicit"

- id: L3-A03
  tier: aggregation_semantics
  question: "Among beneficiaries continuously enrolled for all of 2009, what was the hospitalization rate?"
  gold_sql: |
    SELECT COUNT(DISTINCT i.DESYNPUF_ID)::float
           / COUNT(DISTINCT b.DESYNPUF_ID) AS rate
    FROM bene_2009 b
    LEFT JOIN inpatient i
